<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow | AI Trainer & Artistic Portfolio</title>
    
    <!-- 仅保留 Tailwind CDN，这是最稳定的 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0a0a0a;
            --accent-pink: #FFD1DC;
            --accent-green: #98FB98;
            --accent-blue: #ADD8E6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F5F5; /* 指定的浅米色底色 */
            overflow-x: hidden;
            color: #333;
            min-height: 100vh;
        }

        /* 直接使用用户提供的图片背景 */
        .watercolor-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-image: url('picture/bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            overflow: hidden;
        }

        /* 隐藏之前的动态斑点 */
        .blob {
            display: none;
        }

        /* 增加不规则旋转动画 - 幅度加大以适应大面积色块 */
        @keyframes float-bg {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(5vw, 5vh) scale(1.1) rotate(5deg); }
            100% { transform: translate(-2vw, 10vh) scale(1.15) rotate(-5deg); }
        }

        .paper-texture {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }

        /* 核心容器布局 */
        .page-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 4rem 2rem;
        }

        .main-container {
            width: 95%;
            max-width: 1400px; /* 拉宽主容器 */
            background-color: transparent;
            border-radius: 60px;
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            border: 1px solid rgba(255,255,255,0.2);
            animation: fadeInScale 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.95) translateY(30px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 顶部导航栏 - 进一步压缩 */
        header {
            padding: 12px 4rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            background: rgba(10, 10, 10, 0.9);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .logo-font {
            font-family: 'Caveat', cursive;
            font-size: 2rem; /* 更精致的 Logo */
            color: white;
            transition: transform 0.3s;
            line-height: 1;
        }
        .logo-font:hover { transform: rotate(-3deg) scale(1.05); }

        nav {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        nav a {
            color: rgba(255,255,255,0.4);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 300;
            transition: all 0.3s;
        }
        nav a:hover { color: white; letter-spacing: 0.25em; }

        .search-box {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 30px;
            padding: 0.3rem 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 0.65rem;
            width: 100px;
        }

        /* 内容区卡片 - 增大尺寸与占比 */
        main {
            padding: 4rem 4rem 6rem 4rem; 
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px; /* 统一间距 */
            flex-grow: 1;
            align-items: flex-start; /* 顶部对齐 */
        }

        .art-card {
            background: white;
            width: 450px; /* 统一等宽 450px */
            border-radius: 50px;
            padding: 28px; /* 统一内边距 28px */
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            opacity: 0;
            animation: cardSlideUp 0.8s forwards;
            position: relative;
        }

        /* 添加小黑点装饰：顶部小圆点对齐 */
        .art-card::before {
            content: "";
            position: absolute;
            top: 14px; /* 距离顶部统一 */
            left: 50%;
            transform: translateX(-50%);
            width: 6px; height: 6px;
            background: #1a1a1a;
            border-radius: 50%;
        }

        @keyframes cardSlideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .art-card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 60px 120px rgba(0,0,0,0.2);
        }

        .card-title {
            font-family: 'Caveat', cursive;
            font-size: 28px; /* 标题字号统一为 28px */
            color: #1a1a1a;
            line-height: 1.2;
            text-align: center;
            margin-top: 10px;
        }
        .card-subtitle {
            font-size: 0.75rem;
            color: rgba(0,0,0,0.2);
            letter-spacing: 0.2em;
            text-transform: uppercase;
            font-weight: 700;
            margin-top: -0.5rem;
            text-align: center;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .card-subtitle::before, .card-subtitle::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(0,0,0,0.05);
        }

        .illustration-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px; /* 网格间距对齐 */
            width: 100%;
        }
        .illus-box {
            background: #f9f9f9;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(0,0,0,0.02);
            aspect-ratio: 1 / 1; /* 强制 1:1 正方形 */
        }
        .illus-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            mix-blend-mode: multiply;
            opacity: 0.85;
            transition: all 0.4s;
        }
        .art-card:hover .illus-box img { opacity: 1; transform: scale(1.05); }

        /* 页脚 - 比例呼应 */
        footer {
            padding: 12px 4rem; /* 高度收窄，与导航条呼应 */
            border-top: 1px solid rgba(255,255,255,0.03);
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: rgba(255,255,255,0.85); /* 大幅提高亮度 */
            font-size: 1.05rem; /* 再次调大字体 */
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .social-links {
            display: flex;
            gap: 2rem;
            font-size: 1.2rem;
        }
        .social-links a { 
            color: white; 
            opacity: 0.4; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer;
        }
        .social-links a:hover { 
            opacity: 1; 
            transform: translateY(-5px) scale(1.2); 
            color: var(--accent-pink);
            filter: drop-shadow(0 0 10px rgba(255, 209, 220, 0.5));
        }

        /* 二维码弹窗样式 */
        .qr-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .qr-modal.active {
            opacity: 1;
            pointer-events: auto;
        }

        .qr-content {
            background: #fff;
            padding: 40px;
            border-radius: 50px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.5);
            text-align: center;
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .qr-modal.active .qr-content {
            transform: scale(1);
        }

        .qr-content img {
            width: 280px;
            height: 280px;
            border-radius: 30px;
            margin-bottom: 25px;
            border: 1px solid #f0f0f0;
        }

        .qr-content p {
            font-family: 'Caveat', cursive;
            font-size: 1.8rem;
            color: #1a1a1a;
            margin: 0;
        }

        .close-qr {
            position: absolute;
            top: 30px; right: 30px;
            color: #fff;
            font-size: 2.5rem;
            cursor: pointer;
            opacity: 0.5;
            transition: 0.3s;
        }
        .close-qr:hover { opacity: 1; transform: rotate(90deg); }

        /* 响应式调整 */
        @media (max-width: 768px) {
            header, main, footer { padding: 2rem; }
            .logo-font { font-size: 2.2rem; }
            nav { display: none; }
        }
    </style>
</head>
<body>
    <div class="watercolor-bg"></div>

    <div class="page-wrapper">
        <div class="main-container">
            <!-- 顶部导航 -->
            <header>
                <div class="logo-font">hollow</div>
                <nav>
                    <a href="#">Person</a>
                    <a href="#">Reviews</a>
                    <a href="#">Portfolio</a>
                    <a href="#">Diary/Log</a>
                    <div class="search-box">
                        <input type="text" placeholder="Search...">
                        <i class="fas fa-search text-white/40 text-xs"></i>
                    </div>
                </nav>
            </header>

            <!-- 主内容区 -->
            <main>
                <!-- Card 1 -->
                <div class="art-card" style="animation-delay: 0.2s;">
                    <div>
                        <h2 class="card-title">AI Trainer</h2>
                        <p class="card-subtitle">Multi-modal Studio</p>
                    </div>
                    <div class="illustration-grid">
                        <div class="illus-box"><img src="picture/spring1.jpg"></div>
                        <div class="illus-box"><img src="picture/spring2.jpg"></div>
                        <div class="illus-box"><img src="picture/spring3.jpg"></div>
                        <div class="illus-box"><img src="picture/spring4.jpg"></div>
                    </div>
                </div>

                <!-- Card 2 -->
                <div class="art-card" style="animation-delay: 0.4s;">
                    <div>
                        <h2 class="card-title">Artistry</h2>
                        <p class="card-subtitle">Neural Graphics</p>
                    </div>
                    <div class="illustration-grid">
                        <div class="illus-box"><img src="picture/cloud1.jpg"></div>
                        <div class="illus-box"><img src="picture/cloud2.jpg"></div>
                        <div class="illus-box"><img src="picture/cloud3.jpg"></div>
                        <div class="illus-box"><img src="picture/cloud4.jpg"></div>
                    </div>
                </div>

                <!-- Card 3 -->
                <div class="art-card" style="animation-delay: 0.6s;">
                    <div>
                        <h2 class="card-title">Abstract</h2>
                        <p class="card-subtitle">Data Visuals</p>
                    </div>
                    <div class="illustration-grid">
                        <div class="illus-box"><img src="picture/relaxing1.jpg"></div>
                        <div class="illus-box"><img src="picture/relaxing2.jpg"></div>
                        <div class="illus-box"><img src="picture/relaxing3.jpg"></div>
                        <div class="illus-box"><img src="picture/relaxing4.jpg"></div>
                    </div>
                </div>
            </main>

            <!-- 页脚 -->
            <footer>
                <div>&copy; 2026 Hollow. AI Training Studio Portfolio.</div>
                <div class="social-links">
                    <a href="#"><i class="far fa-envelope"></i></a>
                    <a href="javascript:void(0)" class="qr-trigger"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="#"><i class="far fa-paper-plane"></i></a>
                </div>
            </footer>
        </div>
    </div>

    <!-- 二维码弹窗 -->
    <div class="qr-modal" id="qrModal">
        <div class="close-qr">&times;</div>
        <div class="qr-content">
            <img src="picture/qr.jpg" alt="QR Code">
            <p>Connect with me</p>
        </div>
    </div>

    <script>
        // 实现简单的鼠标视差效果
        const container = document.querySelector('.main-container');
        document.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.pageX) / 50;
            const y = (window.innerHeight / 2 - e.pageY) / 50;
            container.style.transform = `rotateY(${x}deg) rotateX(${y}deg)`;
        });

        // 二维码逻辑
        const qrTrigger = document.querySelector('.qr-trigger');
        const qrModal = document.getElementById('qrModal');
        const closeQr = document.querySelector('.close-qr');

        qrTrigger.addEventListener('click', (e) => {
            e.preventDefault();
            qrModal.classList.add('active');
        });

        closeQr.addEventListener('click', () => {
            qrModal.classList.remove('active');
        });

        qrModal.addEventListener('click', (e) => {
            if (e.target === qrModal) {
                qrModal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
