<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow's Personal Site</title>
    
    <!-- 仅保留 Tailwind CDN，这是最稳定的 -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        /* 使用备用字体，防止外部字体加载失败导致白屏 */
        @font-face {
            font-family: 'Minecraft';
            src: url('https://db.onlinewebfonts.com/t/cabc64a9e10ad0530f91720641113f8d.woff2') format('woff2');
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Minecraft', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfbf7;
            cursor: auto;
        }

        /* --- 糖果按钮样式：参考图 2 优化 --- */
        .mc-button {
            position: relative;
            background-color: #fff;
            border: 3px solid #4a2c2a;
            color: #4a2c2a;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            padding: 14px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 280px;
            font-size: 1.1rem;
            text-decoration: none;
            margin-bottom: 25px;
            opacity: 0;
            transform: scale(0.5);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            box-shadow: 0 6px 0 rgba(74, 44, 42, 0.1);
            z-index: 10;
        }

        /* 包装纸扭出的两侧翅膀 */
        .candy-wrapper::before, .candy-wrapper::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 30px;
            height: 40px;
            background: inherit;
            border: 3px solid inherit;
            border-color: inherit;
            z-index: -1;
            transition: all 0.3s;
        }
        .candy-wrapper::before {
            left: -20px;
            transform: translateY(-50%) rotate(-15deg);
            clip-path: polygon(100% 30%, 0 0, 0 100%, 100% 70%);
        }
        .candy-wrapper::after {
            right: -20px;
            transform: translateY(-50%) rotate(15deg);
            clip-path: polygon(0 30%, 100% 0, 100% 100%, 0 70%);
        }

        /* 形状调整 */
        .candy-oval { border-radius: 60px; } /* 椭圆糖 */
        .candy-striped { 
            background-image: repeating-linear-gradient(45deg, transparent, transparent 15px, rgba(255,255,255,0.3) 15px, rgba(255,255,255,0.3) 30px);
        } /* 带条纹的糖 */
        
        /* 糖果配色 */
        .btn-orange { background-color: #ff9f43; border-color: #e67e22; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-yellow-lemon { background-color: #feca57; border-color: #f39c12; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-pink-sweet { background-color: #ff9ff3; border-color: #f368e0; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-green-mint { background-color: #1dd1a1; border-color: #10ac84; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }
        .btn-chocolate { background-color: #5d4037; border-color: #3e2723; color: #fff; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); border-radius: 8px; }

        /* 高光 */
        .mc-button::after {
            content: "";
            position: absolute;
            top: 10%; left: 15%; width: 30%; height: 15%;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px;
            pointer-events: none;
        }

        .mc-button:hover {
            transform: scale(1.1) rotate(3deg);
            filter: brightness(1.1);
        }
        .mc-button:hover::before { left: -25px; transform: translateY(-50%) rotate(-25deg); }
        .mc-button:hover::after { right: -25px; transform: translateY(-50%) rotate(25deg); }

        .mc-button:active { transform: scale(0.9); }

        /* 点击时的Q弹动画 */
        .jello-click {
            animation: jello 0.6s both;
        }

        @keyframes jello {
            0% { transform: scale3d(1, 1, 1); }
            30% { transform: scale3d(1.25, 0.75, 1); }
            40% { transform: scale3d(0.75, 1.25, 1); }
            50% { transform: scale3d(1.15, 0.85, 1); }
            65% { transform: scale3d(0.95, 1.05, 1); }
            75% { transform: scale3d(1.05, 0.95, 1); }
            100% { transform: scale3d(1, 1, 1); }
        }

        @keyframes popIn {
            to { opacity: 1; transform: scale(1); }
        }

        /* --- NANA 风格背景 --- */
        .nana-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: 
                radial-gradient(circle at 10% 20%, rgba(255, 182, 193, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 90% 10%, rgba(173, 216, 230, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 90%, rgba(255, 253, 208, 0.3) 0%, transparent 50%);
            background-color: #fdfbf7;
        }

        .nana-bg::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('https://www.transparenttextures.com/patterns/paper-fibers.png');
            opacity: 0.2;
        }

        /* --- Logo 样式 --- */
        .mc-logo {
            font-size: clamp(50px, 10vw, 110px);
            color: #fff;
            text-shadow: 
                -4px -4px 0 #373737,  
                 4px -4px 0 #373737,
                -4px  4px 0 #373737,
                 4px  4px 0 #373737,
                 0px  10px 0 #212121;
            letter-spacing: 6px;
            font-weight: bold;
            opacity: 0;
            transform: translateY(-50px);
            animation: dropDown 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .slogan {
            background-color: #ffff00;
            color: #000;
            padding: 6px 16px;
            transform: rotate(-8deg);
            font-size: 1.2rem;
            box-shadow: 6px 6px 0 rgba(0,0,0,0.15);
            display: inline-block;
            border: 2px solid #000;
            animation: pulse 2.5s infinite ease-in-out;
        }

        /* --- 动画定义 --- */
        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }

        @keyframes dropDown {
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { transform: rotate(-8deg) scale(1); }
            50% { transform: rotate(-8deg) scale(1.1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* --- 装饰性涂鸦 --- */
        .doodle {
            position: absolute;
            opacity: 0.6;
            animation: float 4s infinite ease-in-out;
            pointer-events: none;
        }

        .bottom-icon-btn {
            width: 56px; height: 56px;
            background-color: #bcbcbc;
            border: 4px solid #000;
            box-shadow: inset -3px -3px #818181, inset 3px 3px #dbdbdb;
            display: flex; align-items: center; justify-content: center;
            transition: transform 0.2s;
        }
        .bottom-icon-btn:hover { transform: scale(1.1); background-color: #fff; }

        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url("https://upload.wikimedia.org/wikipedia/commons/7/76/1k_Noisy_Texture.png");
            opacity: 0.05; z-index: 100; pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="grain"></div>
    <div class="nana-bg"></div>

    <div class="relative h-screen w-screen flex flex-col items-center justify-between py-16 px-8 select-none overflow-hidden">
        
        <!-- 装饰性元素 (NANA 风格) -->
        <div class="doodle" style="top: 15%; left: 10%; animation-delay: 0s;">
            <svg width="60" height="60" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="40" fill="#ff6b6b" fillOpacity="0.6" />
                <path d="M50 10 Q60 0 70 10" stroke="#4a2c2a" strokeWidth="4" fill="none" />
            </svg>
            <div class="text-center text-xs font-bold opacity-70">apple</div>
        </div>

        <div class="doodle" style="top: 60%; right: 15%; animation-delay: 1s;">
            <svg width="80" height="60" viewBox="0 0 100 80">
                <ellipse cx="50" cy="40" rx="40" ry="30" fill="#fff" fillOpacity="0.8" />
                <circle cx="20" cy="40" r="10" fill="#333" />
                <rect x="30" y="65" width="4" height="15" fill="#333" />
                <rect x="65" y="65" width="4" height="15" fill="#333" />
            </svg>
            <div class="text-center text-xs font-bold opacity-70">sheep</div>
        </div>

        <!-- 顶部标题区 -->
        <div class="flex flex-col items-center gap-6">
            <h1 class="mc-logo">HOLLOW</h1>
        </div>

        <!-- 中间菜单按钮区 -->
        <div class="flex flex-col w-full items-center z-10">
            <a href="#" class="mc-button candy-oval candy-wrapper btn-orange candy-striped" style="animation-delay: 0.4s;" onclick="playClick(this)">语雀文档</a>
            <a href="#" class="mc-button candy-oval btn-yellow-lemon" style="animation-delay: 0.5s;" onclick="playClick(this)">腾讯文档</a>
            <a href="https://github.com/hollow" class="mc-button candy-oval candy-wrapper btn-pink-sweet" style="animation-delay: 0.6s;" onclick="playClick(this)">Github</a>
            <a href="#" class="mc-button candy-oval btn-green-mint" style="animation-delay: 0.7s;" onclick="playClick(this)">Bilibili</a>
            <a href="PWeb.html" class="mc-button btn-chocolate" style="animation-delay: 0.8s;" onclick="playClick(this)">关于我</a>
        </div>

        <!-- 底部功能区 -->
        <div class="w-full flex flex-col md:flex-row justify-between items-center md:items-end gap-6">
            <div class="flex gap-4 items-center">
                <button class="bottom-icon-btn">
                    <img src="https://img.icons8.com/color/48/weixing.png" alt="WeChat" class="w-8 h-8">
                </button>
                <button class="mc-button max-w-fit px-8 mb-0" style="animation-delay: 1s;">加个微信</button>
            </div>
            <button class="mc-button max-w-fit px-16 text-xl mb-0" style="animation-delay: 1.1s;">E-Mail</button>
        </div>

    </div>

    <script>
        // 创建音效
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playClick(el) {
            // 添加Q弹动画类
            el.classList.remove('jello-click');
            void el.offsetWidth; // 触发重绘
            el.classList.add('jello-click');

            // 播放清脆的糖果音效
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
            
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }
    </script>
</body>
</html>
